project:
  # Windows Python example:
  # dir: "E:/Marion_data/EGD"
  # WSL/Linux example:
  dir: "/mnt/f/Marion_data/EGD"

paths:
  # Step 1: MRI path inventory
  mri_paths_xlsx: "MRI_paths.xlsx"

  # Step 2: Radiomics extraction
  radiomics_input_xlsx: "MRI_paths.xlsx"
  radiomics_output_xlsx: "radiomics_T1.xlsx"

  # Step 3: Clinical merge + split
  clinical_xlsx: "clinical.xlsx"
  split_xlsx: "data_split.xlsx"
  merged_xlsx: "radiomics_clinical_merged.xlsx"
  train_validation_xlsx: "phantom_train_validation.xlsx"
  test_xlsx: "phantom_test.xlsx"

  # Feature-selection descriptive report
  feature_selection_output_dir: "Feature_selection_results"

  # Machine-learning outputs
  ml_output_dir: "ML_results"
  ml_performance_xlsx: "model_performance.xlsx"
  ml_comparison_png: "model_comparison.png"

columns:
  case: "case"
  split: "split"
  target: "target"

radiomics:
  image_column: "T1"
  mask_column: "MASK"
  params_file: null
  sequence_case_prefix: "MR_"

split:
  train_validation_label: "train-validation"
  test_label: "test"
  keep_split_column: false

feature_selection:
  enabled: true

  # If explicit feature names are provided here, they override prefix detection.
  radiomics_feature_columns: null

  # PyRadiomics feature names usually begin with original_, wavelet_, etc.
  # rad_ is included for the phantom/demo XLSX files.
  radiomics_feature_prefixes:
    - "original_"
    - "wavelet_"
    - "square_"
    - "squareroot_"
    - "logarithm_"
    - "exponential_"
    - "gradient_"
    - "lbp-"
    - "rad_"

  variance:
    enabled: true
    threshold: 0.0

  correlation:
    enabled: true
    method: "spearman"
    threshold: 0.90

  lasso:
    enabled: true
    inner_cv_folds: 5
    scoring: "roc_auc"
    C_values:
      - 0.001
      - 0.003
      - 0.01
      - 0.03
      - 0.1
      - 0.3
      - 1.0
      - 3.0
      - 10.0
    max_iter: 10000
    coefficient_tolerance: 1.0e-8
    min_features: 1
    class_weight: null

  report_xlsx: "feature_selection_report.xlsx"
  selected_features_png: "selected_features.png"

ml:
  random_state: 42
  cv_folds: 5
  bootstrap_iterations: 2000
  ci_level: 0.95

  # These columns are metadata only and must never enter the model.
  ignore_columns:
    - "case"
    - "image_sequence"
    - "image_path"
    - "mask_path"

  enabled_models:
    - "Logistic Regression"
    - "SVM (RBF)"
    - "Random Forest"
    - "Extra Trees"
    - "Gradient Boosting"
    - "Hist Gradient Boosting"
    - "AdaBoost"
    - "KNN"
    - "Decision Tree"
    - "Gaussian Naive Bayes"
    - "LDA"
    - "QDA"
    - "MLP"
